
<div class="event-card">
  <button class="heart-btn" (click)="toggleFavorite()">  {{ favorite ? '❤️' : '🤍' }}</button>
<img
  class="event-image"
  [src]="event.image"
  [alt]="event.title">

  <div class="event-content">
  <h3>{{ event.title }}</h3>
  <p class="event-category">
      {{ event.category }}
    </p>

    <p class="event-date">
      {{ event.date }}
    </p>

    <p class="event-location">
      {{ event.location }}
    </p>

     @if(event.ticketTypes.length){

    <p class="event-price">
      ${{event.ticketTypes[0].price}}
    </p>

    }
    <button class="details-btn" [routerLink]="['/events', event.id]">
      View Details
    </button>

  </div>

</div>
